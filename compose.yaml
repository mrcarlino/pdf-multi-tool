services:
  pdf-multi-tool:
    build: .
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg  # WSLg display (WSL2 only)
      - /mnt/c:/mnt/c        # Windows files (WSL2 only), e.g. /mnt/c/Users/<you>
      - ${HOME_DIR:-${HOME:-${USERPROFILE:-.}}}:/home/user
